<title>แบบฝึกหัด PK — interactive</title>

<!--
  ===========================================================================
  quiz-pk-principles.html — แบบฝึกหัดเภสัชจลนศาสตร์แบบ interactive
  ปรับจาก "ข้อสอบ PKprin2565" (บรรยาย 24 ข้อ + ปฏิบัติการ 10 ข้อ = 34 ข้อ)
  เฉลยดึงจากไฮไลต์สีเหลืองในไฟล์ Word ต้นฉบับของอาจารย์

  • ไฟล์ standalone — เปิดเดี่ยวได้ และถูกเรียกผ่านแท็บใน index.html
  • prefix id: qpk-
  • รูปแบบ: กดเลือก → เฉลยทันที + คำอธิบายเชิงวิชาการ + นับคะแนน

  หมายเหตุที่ต้องให้อาจารย์ยืนยัน (ค้นด้วยคำว่า REVIEW ในไฟล์นี้):
    1) ข้อบรรยาย #7  — โจทย์หายในไฟล์ Word ต้นฉบับ → ดิฉันร่างโจทย์ให้ (รออนุมัติ)
    2) ข้อบรรยาย #8  — ion trapping ที่กระเพาะ: เฉลยในไฟล์ = กรดอ่อน แต่หลักมาตรฐาน
                        ควรเป็นด่างอ่อน → ใส่ธงรอยืนยัน
  ===========================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#2A2150; --sub:#6B6486; --indigo:#6366F1; --purple:#A855F7;
    --bg1:#FDF4FF; --bg2:#EFFBFF; --line:#E7DEF4;
    --ok:#16A34A; --okbg:#ECFDF3; --okline:#A7F3D0;
    --no:#DC2626; --nobg:#FEF2F2; --noline:#FECACA;
    --warn:#B45309; --warnbg:#FFFBEB; --warnline:#FDE68A;
  }
  *{box-sizing:border-box}
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{
    margin:0; color:var(--ink);
    font-family:'Sarabun',system-ui,sans-serif;
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    line-height:1.55;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{ max-width:820px; margin:0 auto; padding:20px 16px 80px; }

  .head h1{
    font-family:'Mitr',sans-serif; font-weight:600;
    font-size:1.32rem; margin:0 0 4px; color:var(--ink);
  }
  .head p{ color:var(--sub); font-size:.9rem; margin:0 0 2px; }

  /* แถบคะแนนแบบลอย */
  .scorebar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:rgba(255,255,255,.9); backdrop-filter:blur(8px);
    border:1px solid var(--line); border-radius:14px;
    padding:10px 14px; margin:14px 0 6px;
    box-shadow:0 4px 16px rgba(99,102,241,.10);
  }
  .scorebar .big{
    font-family:'Mitr',sans-serif; font-weight:600; font-size:1.05rem; color:var(--indigo);
  }
  .scorebar .meta{ font-size:.82rem; color:var(--sub); }
  .scorebar .track{ flex:1 1 140px; height:8px; background:#EEE7F8; border-radius:99px; overflow:hidden; min-width:120px; }
  .scorebar .fill{ height:100%; width:0%; background:linear-gradient(90deg,var(--indigo),var(--purple)); transition:width .3s ease; }
  .scorebar button{
    font-family:'Mitr',sans-serif; font-size:.82rem; color:var(--sub);
    background:#fff; border:1px solid var(--line); border-radius:99px;
    padding:6px 12px; cursor:pointer;
  }
  .scorebar button:hover{ color:var(--indigo); border-color:var(--indigo); }

  .sec-title{
    font-family:'Mitr',sans-serif; font-weight:600; font-size:1.06rem;
    color:var(--purple); margin:26px 0 4px;
    display:flex; align-items:baseline; gap:8px;
  }
  .sec-title .cnt{ font-family:'Sarabun'; font-weight:400; font-size:.82rem; color:var(--sub); }

  .card{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:16px 16px 6px; margin:14px 0;
    box-shadow:0 2px 10px rgba(42,33,80,.05);
  }
  .qnum{
    font-family:'Mitr',sans-serif; font-weight:500; font-size:.78rem;
    color:#fff; background:var(--indigo);
    border-radius:8px; padding:2px 9px; display:inline-block; margin-bottom:8px;
  }
  .flag{
    font-size:.72rem; color:var(--warn); background:var(--warnbg);
    border:1px solid var(--warnline); border-radius:8px;
    padding:2px 8px; margin-left:6px; display:inline-block;
  }
  .stem{ font-weight:600; font-size:1rem; margin:0 0 4px; }
  .stem .desc{ display:block; font-weight:400; font-size:.92rem; color:var(--sub); margin-top:6px; }
  .subitems{ margin:6px 0 2px; padding-left:2px; }
  .subitems div{ font-size:.9rem; color:#463c6e; margin:3px 0; padding-left:14px; text-indent:-14px; }

  .opts{ list-style:none; margin:10px 0 6px; padding:0; }
  .opt{
    display:flex; align-items:flex-start; gap:10px;
    border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin:7px 0; cursor:pointer;
    background:#fff; transition:all .12s ease; font-size:.95rem;
  }
  .opt:hover{ border-color:var(--indigo); background:#FBF9FF; }
  .opt .mk{
    flex:0 0 auto; width:22px; height:22px; border-radius:99px;
    border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-family:'Mitr',sans-serif; font-size:.78rem; color:var(--sub); background:#fff;
  }
  .opt.correct{ border-color:var(--okline); background:var(--okbg); }
  .opt.correct .mk{ border-color:var(--ok); background:var(--ok); color:#fff; }
  .opt.wrong{ border-color:var(--noline); background:var(--nobg); }
  .opt.wrong .mk{ border-color:var(--no); background:var(--no); color:#fff; }
  .opts.locked .opt{ cursor:default; }
  .opts.locked .opt:hover{ background:#fff; border-color:var(--line); }
  .opts.locked .opt.correct:hover{ background:var(--okbg); border-color:var(--okline); }
  .opts.locked .opt.wrong:hover{ background:var(--nobg); border-color:var(--noline); }

  .explain{
    display:none; margin:4px 2px 12px; padding:12px 14px;
    background:var(--okbg); border:1px solid var(--okline); border-radius:12px;
    font-size:.92rem; color:#14532d;
  }
  .explain.show{ display:block; }
  .explain b{ color:var(--ok); }
  .explain .ans{ font-weight:700; }

  /* กราฟ SVG */
  .graph{ margin:10px 0 4px; text-align:center; }
  .graph svg{ max-width:100%; height:auto; }

  .footnote{ color:var(--sub); font-size:.8rem; margin-top:30px; text-align:center; }

  @media (max-width:480px){
    .wrap{ padding:14px 12px 70px; }
    .head h1{ font-size:1.15rem; }
    .opt{ font-size:.9rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🧪 แบบฝึกหัดเภสัชจลนศาสตร์</h1>
    <p>ปรนัย 34 ข้อ · แบ่งเป็นส่วนบรรยาย 24 ข้อ และปฏิบัติการ 10 ข้อ</p>
    <p>เลือกคำตอบเพื่อดูเฉลยและคำอธิบายทันที — เน้นเรียนรู้ ไม่นับเป็นเกรด</p>
  </div>

  <div class="scorebar" id="qpk-scorebar">
    <span class="big" id="qpk-score">คะแนน 0 / 34</span>
    <span class="meta" id="qpk-meta">ตอบแล้ว 0 ข้อ</span>
    <span class="track"><span class="fill" id="qpk-fill"></span></span>
    <button id="qpk-reset" type="button">เริ่มใหม่</button>
  </div>

  <div id="qpk-quiz"></div>

  <p class="footnote">พัฒนาโดย ผศ.ดร. ภัควดี เสริมสรรพสุข คณะเภสัชศาสตร์ ม.นเรศวร — เฉลยอ้างอิงจากต้นฉบับการเรียน</p>
</div>

<script>
/* =========================================================================
   ชุดแบบฝึกหัด — แก้เนื้อหา/เฉลย/คำอธิบายได้ที่นี่ที่เดียว
   โครงแต่ละข้อ:
     { stem, desc?, sub?[], opts:[...], answer: <index เริ่มที่ 0>, ex, flag? }
   answer = ตำแหน่งตัวเลือกที่ถูก (0 = ตัวแรก)

var GRAPH_L = ''
+ '<div class="graph"><svg viewBox="0 0 430 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="กราฟความเข้มข้นยา L เทียบเวลา">'

+ '<line x1="40" y1="220" x2="410" y2="220" stroke="#B7ABD6" stroke-width="1.5"/>'

+ '<line x1="100" y1="220" x2="100" y2="224" stroke="#B7ABD6"/><text x="100" y="236">2</text>'

var SECTIONS = [
{
  title: 'ส่วนที่ 1 — การเรียนบรรยาย',
  qs: [
    { stem:'ถ้าหากให้ยา X โดยการรับประทาน 100 mg ครั้งเดียว แล้วไม่เกิดผลในการรักษา แสดงว่า',
      opts:['ระดับยาต่ำกว่า MEC','ยามี %Foral น้อยกว่าค่าขอบล่างของช่วงในการรักษา','ยากระจายตัวเข้าสู่เซลล์ไขมันซึ่งสะสมยาได้น้อย','ค่า AUC มีค่าต่ำกว่า MTC','ยามีค่า CL ลดต่ำลง'],
      answer:0,
      ex:'การให้ยาครั้งเดียวแล้วไม่ออกฤทธิ์ แปลว่าระดับยา ณ ตำแหน่งออกฤทธิ์ยังไม่ถึง <b>MEC (minimum effective concentration)</b> จึงไม่เห็นผลการรักษา ส่วน MTC คือขอบบน (ขอบพิษ) การที่ AUC ต่ำกว่า MTC เป็นเรื่องปกติของยาที่ปลอดภัย ไม่ได้บอกว่าไม่ออกฤทธิ์' },

    { stem:'ยาควรมีคุณสมบัติอย่างไร จึงจะมี permeability ที่สูงในการเคลื่อนที่ผ่านเซลล์ด้วยวิธี passive diffusion',
      opts:['เป็น substrate ของ OCT','เป็น peptide','ยามีขนาดโมเลกุล > 1000 g/mol','ยาละลายไขมันได้ดี','ยามี % ionization สูง'],
      answer:3,
      ex:'passive diffusion ผ่านเยื่อหุ้มเซลล์ (lipid bilayer) ได้ดีเมื่อยา <b>ละลายไขมันได้ดี (lipophilic)</b> ขนาดโมเลกุลเล็ก และอยู่ในรูปไม่แตกตัว ส่วน substrate ของ OCT หรือ peptide ต้องอาศัยตัวพา (carrier-mediated) ไม่ใช่ passive; โมเลกุลใหญ่ > 1000 และ ionization สูง ยิ่งผ่านยาก' },

    { stem:'ถ้ายามี %Foral ~30 แสดงว่า',
      opts:['ยามี enterohepatic recirculation','ยามี First pass loss สูง','ยามีค่า Clearance ต่ำ','ยามีดูดซึมได้เร็ว','ยาออกฤทธิ์ได้นาน'],
      answer:1,
      ex:'ชีวประสิทธิผลทางปาก (F) เพียง ~30% แสดงว่ายาส่วนใหญ่สูญเสียก่อนถึงระบบไหลเวียนใหญ่ = <b>first-pass loss สูง</b> (ที่ผนังลำไส้/ตับ) ส่วน EHC จะทำให้ t½ ยาวขึ้น และ CL ต่ำจะทำให้ F <i>สูงขึ้น</i>ด้วยซ้ำ' },

    { stem:'การให้ยาด้วยวิธีการใดสามารถหลีกเลี่ยงการเกิด first-pass metabolism ได้',
      opts:['การรับประทานยาในรูปแบบ solution','การรับประทานยาในรูปแบบ enteric coated tablet','การรับประทานยาในรูปแบบ sustained-release tablet','การรับประทานยาในรูปแบบ sugar coated tablet','การอมใต้ลิ้นยาในรูปแบบ plain tablet'],
      answer:4,
      ex:'การ<b>อมใต้ลิ้น (sublingual)</b> ยาดูดซึมเข้าหลอดเลือดดำใต้ลิ้นสู่ systemic circulation โดยตรง ไม่ผ่านตับก่อน จึงเลี่ยง hepatic first-pass ได้ ส่วนยารับประทานทุกชนิดถูกดูดซึมเข้า portal vein ผ่านตับก่อนเสมอ' },

    { stem:'ถ้าให้ยาชนิดเดียวกันในขนาดที่เท่ากัน การให้ยาใน dosage form ใด จะให้ Tmax ต่ำสุด และ Cmax สูงสุด (กำหนดให้ absolute oral bioavailability ของทุก dosage form เท่ากัน)',
      opts:['Solution','Suspension','Capsule','Tablet','Enteric coated tablet'],
      answer:0,
      ex:'ยาในรูป <b>solution</b> ละลายอยู่แล้ว พร้อมดูดซึมทันที ไม่ต้องผ่านขั้น disintegration/dissolution จึงดูดซึมเร็วที่สุด → <b>Tmax สั้นสุด, Cmax สูงสุด</b> ลำดับอัตราเร็วการดูดซึม: solution &gt; suspension &gt; capsule &gt; tablet &gt; enteric coated' },

    { stem:'การเปรียบเทียบสัดส่วนของปริมาณยาที่ถูกดูดซึมระหว่างยาเม็ดที่ทำเลียนแบบ (generic) กับยาเม็ดต้นแบบ เป็นการศึกษาเพื่อหาค่าอะไร',
      opts:['Onset','Duration of action','Therapeutic index','Absolute bioavailability','Relative bioavailability'],
      answer:4,
      ex:'การเทียบปริมาณดูดซึมของยา 2 ผลิตภัณฑ์ที่ให้ทางเดียวกัน (generic เทียบต้นแบบ ทั้งคู่รับประทาน) = <b>relative bioavailability</b> ส่วน absolute bioavailability คือการเทียบกับการให้ทางหลอดเลือดดำ (IV, F = 100%)' },

    { stem:'ถ้าให้ยาพร้อมอาหาร (โดยเฉพาะอาหารที่มีไขมันสูง) จะมีผลต่อการดูดซึมยาอย่างไร',
      opts:['ยาอาจจะถูกดูดซึมได้เพิ่มขึ้น','ยาอาจจะถูกดูดซึมได้ช้าลง','ยาอาจจะออกฤทธิ์ได้เร็วขึ้น','ยาอาจจะออกฤทธิ์ได้นานขึ้น','ยาอาจจะเกิด enterohepatic recirculation ได้น้อยลง'],
      answer:1,
      ex:'อาหารชะลอการบีบตัวของกระเพาะ (delayed gastric emptying) ทำให้ยาลงสู่ลำไส้เล็กช้าลง → <b>อัตราการดูดซึมช้าลง</b> Tmax ยาวขึ้น (แม้บางกรณีปริมาณดูดซึมรวมอาจเพิ่ม แต่ "อัตราเร็ว" ช้าลง)' },

    { stem:'ยาที่มีคุณสมบัติใดต่อไปนี้เกิด ion trapping ได้ที่เซลล์เยื่อบุกระเพาะอาหาร',

/* ===================== ตัวสร้างหน้า + ตรรกะโต้ตอบ ===================== */
(function(){
  var quiz = document.getElementById('qpk-quiz');
  var TOTAL = SECTIONS.reduce(function(s,sec){ return s + sec.qs.length; }, 0);
  var answered = 0, correct = 0;
  var gi = 0; // running question index

  var elScore = document.getElementById('qpk-score');
  var elMeta  = document.getElementById('qpk-meta');
  var elFill  = document.getElementById('qpk-fill');

  function esc(s){ return s; } // เนื้อหาเป็นข้อความที่เราคุมเอง อนุญาต markup ใน stem/ex

  function updateBar(){
    elScore.textContent = 'คะแนน ' + correct + ' / ' + TOTAL;
    elMeta.textContent  = 'ตอบแล้ว ' + answered + ' ข้อ' + (answered===TOTAL ? ' — ครบแล้ว 🎉' : '');
    elFill.style.width  = (answered/TOTAL*100) + '%';
  }

  SECTIONS.forEach(function(sec){
    var h = document.createElement('div');
    h.className = 'sec-title';
    h.innerHTML = esc(sec.title) + ' <span class="cnt">(' + sec.qs.length + ' ข้อ)</span>';
    quiz.appendChild(h);

    sec.qs.forEach(function(q){
      gi++;
      var card = document.createElement('div');
      card.className = 'card';

      var head = '<span class="qnum">ข้อ ' + gi + '</span>';
      if (q.flag){ head += '<span class="flag">⚠️ ' + q.flag + '</span>'; }

      var stem = '<div class="stem">' + q.stem;
      if (q.desc){ stem += '<span class="desc">' + q.desc + '</span>'; }
      stem += '</div>';

      var sub = '';
      if (q.sub){
        sub = '<div class="subitems">';
        q.sub.forEach(function(s,i){ sub += '<div>' + (i+1) + '. ' + s + '</div>'; });
        sub += '</div>';
      }

      var graph = q.graph ? GRAPH_L : '';

      card.innerHTML = head + stem + sub + graph;

      var ul = document.createElement('ul');
      ul.className = 'opts';
      var letters = ['ก','ข','ค','ง','จ'];
      q.opts.forEach(function(txt, i){
        var li = document.createElement('li');
        li.className = 'opt';
        li.innerHTML = '<span class="mk">' + (letters[i]||(i+1)) + '</span><span>' + txt + '</span>';
        li.onclick = function(){ choose(); };
        function choose(){
          if (ul.classList.contains('locked')) return;
          ul.classList.add('locked');
          answered++;
          var isRight = (i === q.answer);
          if (isRight) correct++;
          li.classList.add(isRight ? 'correct' : 'wrong');
          if (!isRight){
            // ไฮไลต์ข้อที่ถูกให้เห็นด้วย
            ul.children[q.answer].classList.add('correct');
          }
          ex.classList.add('show');
          updateBar();
        }
        ul.appendChild(li);
      });
      card.appendChild(ul);

      var ex = document.createElement('div');
      ex.className = 'explain';
      var ansTxt = q.opts[q.answer];
      ex.innerHTML = '<span class="ans">✓ เฉลย: ' + (letters[q.answer]||'') + '. ' + ansTxt + '</span><br>' + q.ex;
      card.appendChild(ex);

      quiz.appendChild(card);
    });
  });

  updateBar();

  document.getElementById('qpk-reset').onclick = function(){
    if (confirm('ล้างคำตอบทั้งหมดและเริ่มทำใหม่?')) location.reload();
  };
})();
</script>
</body>
</html>
