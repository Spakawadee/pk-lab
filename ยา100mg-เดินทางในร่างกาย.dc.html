@media (orientation:portrait) and (max-width:600px){
  [data-screen-label]{ padding:0 !important; overflow:hidden !important; }
  #adme-stage{
    position:fixed; top:50%; left:50%;
    width:min(100vh, calc(100vw*1280/760)) !important;   /* หมุนแล้วพอดีทั้งกว้างและสูง */
    transform:translate(-50%,-50%) rotate(90deg);
    transform-origin:center center;
    border-radius:0 !important;
  }
  [data-screen-label]::after{
    content:"📱 หมุนโทรศัพท์เป็นแนวนอน เพื่อดูภาพตั้งตรงและใหญ่เต็มจอ";
    position:fixed; left:0; right:0; bottom:10px; z-index:9;
    text-align:center; padding:0 12px; pointer-events:none;
    font-family:'Noto Sans Thai Looped',sans-serif; font-size:13px;
    color:#cdd8ea; opacity:.85;
  }
}
</style>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { t: 0, playing: true };

  componentDidMount(){
    this._build();
    this.elapsed = 0;
    this.last = performance.now();
    const loop = (now)=>{
      const dt = Math.min(0.05,(now - this.last)/1000); this.last = now;
      if(this.state.playing){
        this.elapsed += dt;
        if(this.elapsed >= this.LOOP) this.elapsed -= this.LOOP;
        this.setState({ t: this.elapsed });
      }
      this._raf = requestAnimationFrame(loop);
    };
    this._raf = requestAnimationFrame(loop);
  }
  componentWillUnmount(){ if(this._raf) cancelAnimationFrame(this._raf); }

  _mix(c1,c2,f){
    const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
    const A=p(c1),B=p(c2);
    return 'rgb('+Math.round(A[0]+(B[0]-A[0])*f)+','+Math.round(A[1]+(B[1]-A[1])*f)+','+Math.round(A[2]+(B[2]-A[2])*f)+')';
  }
  _pos(wp,t){
    if(t<=wp[0].t) return {x:wp[0].x,y:wp[0].y};
    for(let k=0;k<wp.length-1;k++){const a=wp[k],b=wp[k+1];
      if(t<=b.t){let f=(t-a.t)/(b.t-a.t);f=f*f*(3-2*f);return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f};}}
    const l=wp[wp.length-1];return {x:l.x,y:l.y};
  }
  _num(kf,t){
    if(t<=kf[0].t) return kf[0].v;
    for(let k=0;k<kf.length-1;k++){const a=kf[k],b=kf[k+1];if(t<=b.t){const f=(t-a.t)/(b.t-a.t);return a.v+(b.v-a.v)*f;}}
    return kf[kf.length-1].v;
  }
  _col(kf,t){
    if(kf.length===1||t<=kf[0].t) return kf[0].c;
    for(let k=0;k<kf.length-1;k++){const a=kf[k],b=kf[k+1];if(t<=b.t){return this._mix(a.c,b.c,(t-a.t)/(b.t-a.t));}}
    return kf[kf.length-1].c;
  }

  _build(){
    if(this._built) return; this._built=true;
    this.LOOP = 20;
    // graph geometry
    this.gx0=690; this.gx1=1200; this.gyB=440;
    this.pxPerH=(this.gx1-this.gx0)/8;
    this.GSCALE=320;          // green plasma curve amplitude (emphasized)
    this.MECu=0.36;           // minimum effective concentration (unit)
    this.mecY=this.gyB-this.MECu*this.GSCALE;
    this.ORAL=[]; this.units=[];
    for(let j=0;j<=80;j++){
      const th=j*0.1;
      const unit=Math.exp(-0.25*th)-Math.exp(-1.5*th);
      const x=this.gx0+th*this.pxPerH;
      this.units.push(unit);
      this.ORAL.push({x,y:this.gyB-unit*this.GSCALE});
    }
    this.peakIdx=this.units.reduce((bi,u,i,a)=>u>a[bi]?i:bi,0);
    let onIdx=this.peakIdx;
    for(let j=1;j<this.peakIdx;j++){ if(this.units[j]>=this.MECu){onIdx=j;break;} }
    let offIdx=this.peakIdx;
    for(let j=this.peakIdx;j<this.units.length;j++){ if(this.units[j]<this.MECu){offIdx=j;break;} }
    const oa=this.units[onIdx-1], ob=this.units[onIdx];
    this.onsetF=(onIdx-1)+(this.MECu-oa)/(ob-oa);
    const fa=this.units[offIdx-1], fb=this.units[offIdx];
    this.offsetF=(offIdx-1)+(this.MECu-fa)/(fb-fa);
    this.onsetX=this.gx0+(this.onsetF*0.1)*this.pxPerH;
    this.offsetX=this.gx0+(this.offsetF*0.1)*this.pxPerH;

    // anatomy points
    const off=(i)=>{const a=i*2.39996;return {x:Math.cos(a)*14,y:Math.sin(a)*14};};
    const STOM={x:296,y:268}, INT={x:296,y:344}, PORT={x:296,y:386},
          LIV={x:296,y:430}, HV={x:296,y:474}, HEART={x:296,y:520},
          TARGET={x:466,y:520}, KID={x:296,y:620}, URINE={x:296,y:690};
    const green='#3ddc97', orange='#f3a64b', gray='#7a8699';
    this.PT=[];
    for(let i=0;i<10;i++){
      const o=off(i);
      const notAbs=i===9, firstPass=(i>=3&&i<9), survive=i<3;
      const wp=[{t:0,x:STOM.x+o.x,y:STOM.y+o.y},
                {t:3.4,x:STOM.x+o.x,y:STOM.y+o.y},
                {t:4.5,x:INT.x+o.x*0.7,y:INT.y+o.y*0.7}];
      const op=[{t:0,v:0},{t:2.0,v:0},{t:2.6,v:1}];
      const col=[{t:0,c:green}];
      const rad=[{t:0,v:6.5}];
      if(notAbs){
        // not absorbed: stays in gut, exits downward
        wp.push({t:5.5,x:INT.x+12,y:INT.y+6},{t:8.0,x:INT.x+12,y:INT.y+6},
                {t:10.0,x:INT.x+8,y:INT.y+120},{t:20,x:INT.x+8,y:INT.y+120});
        op.push({t:8.0,v:1},{t:10.0,v:0.25},{t:20,v:0});
        col.push({t:6.0,c:green},{t:7.2,c:gray});
      } else if(firstPass){
        // absorbed, but removed by FIRST-PASS at liver (part of Absorption)
        const s=(i-3)*0.10;
        wp.push({t:5.4+s,x:INT.x+o.x*0.6,y:INT.y+o.y*0.6});
        wp.push({t:6.5+s,x:PORT.x+o.x*0.5,y:PORT.y});
        wp.push({t:7.6+s,x:LIV.x+o.x,y:LIV.y+o.y*0.6});
        wp.push({t:8.8,x:LIV.x+o.x*1.4,y:LIV.y+o.y*0.9});
        wp.push({t:20,x:LIV.x+o.x*1.4,y:LIV.y+o.y*0.9});
        col.push({t:7.8,c:green},{t:8.8,c:orange});
        op.push({t:8.8,v:1},{t:10.4,v:0},{t:20,v:0});
      } else { // survive first-pass -> systemic -> distribute -> back to liver(M) -> kidney(E)
        const s=i*0.10;
        wp.push({t:5.4+s,x:INT.x+o.x*0.6,y:INT.y+o.y*0.6});
        wp.push({t:6.5+s,x:PORT.x+o.x*0.5,y:PORT.y});
        wp.push({t:7.6+s,x:LIV.x+o.x*0.5,y:LIV.y});   // pass through liver (survive)
        wp.push({t:8.7+s,x:HV.x+o.x*0.4,y:HV.y});
        wp.push({t:9.7+s,x:HEART.x+o.x*0.6,y:HEART.y+o.y*0.6}); // enters systemic (end A)
        wp.push({t:11.2+i*0.25,x:TARGET.x+o.x*0.7,y:TARGET.y+o.y*0.7}); // D
        wp.push({t:12.6+i*0.25,x:HEART.x+o.x*0.8,y:HEART.y+o.y*0.8});
        wp.push({t:13.9+i*0.15,x:LIV.x+o.x*1.2,y:LIV.y+o.y*0.8}); // back to liver (M)
        wp.push({t:15.6,x:KID.x+o.x*0.6,y:KID.y+o.y*0.5});  // E
        wp.push({t:17.0,x:URINE.x+o.x*0.4,y:URINE.y});
        wp.push({t:20,x:URINE.x+o.x*0.4,y:URINE.y});
        col.push({t:13.9,c:green},{t:14.9,c:orange}); // metabolized on return to liver
        op.push({t:17.0,v:1},{t:18.2,v:0},{t:20,v:0});
      }
      this.PT.push({wp,op,col,rad,survive});
    }
  }

  renderVals(){
    this._build();
    const t=this.state.t, L=this.LOOP;
    const cl=(v)=>Math.max(0,Math.min(1,v));
    const ramp=(a,b)=>{let f=cl((t-a)/(b-a));return f*f*(3-2*f);};
    const win=(a,b)=> (t>=a&&t<b)?1:0;

    // capsule swallow
    const cap=this._pos([{t:0,x:296,y:200},{t:0.6,x:296,y:200},{t:2.0,x:296,y:268}],t);
    let capOp=1;
    if(t<0.35) capOp=t/0.35;
    else if(t>=2.0&&t<2.6) capOp=1-(t-2.0)/0.6;
    else if(t>=2.6) capOp=0;
    const capTransform='translate('+cap.x.toFixed(1)+' '+cap.y.toFixed(1)+') rotate('+(((t*55)%360)).toFixed(1)+')';

    // particles
    const particles=this.PT.map((mm)=>{
      const p=this._pos(mm.wp,t);
      const r=this._num(mm.rad,t);
      const inBlood=mm.survive&&t>9.6&&t<13.0;
      const glowOp=inBlood?0.5:0;
      return {x:+p.x.toFixed(1),y:+p.y.toFixed(1),r:+r.toFixed(2),
        fill:this._col(mm.col,t),op:+this._num(mm.op,t).toFixed(2),
        glowOp:+glowOp.toFixed(2),glowR:+(r+7).toFixed(1)};
    });

    // counters
    const nAbsorbed=Math.round(90*ramp(4.5,7.0));
    const nNotAbs=Math.round(10*ramp(5.5,7.0));
    const nLoss=Math.round(60*ramp(7.6,9.6));
    const nSystemic=Math.round(30*ramp(9.2,11.0));
    const fPctStr=nSystemic+'%';

    // graph reveal (drug in systemic blood)
    const gfrac=cl((t-9.7)/8.5);
    const N=this.ORAL.length;
    const fx=gfrac*(N-1); const idx=Math.floor(fx); const fr=fx-idx;
    const interp=(arr)=>{const a=arr[Math.min(idx,N-1)],b=arr[Math.min(idx+1,N-1)];return {x:a.x+(b.x-a.x)*fr,y:a.y+(b.y-a.y)*fr};};
    const penO=interp(this.ORAL);
    let oralD='M '+this.ORAL[0].x.toFixed(1)+' '+this.ORAL[0].y.toFixed(1);
    for(let k=1;k<=idx;k++) oralD+=' L '+this.ORAL[k].x.toFixed(1)+' '+this.ORAL[k].y.toFixed(1);
    oralD+=' L '+penO.x.toFixed(1)+' '+penO.y.toFixed(1);
    let aucD='M '+this.ORAL[0].x.toFixed(1)+' '+this.gyB;
    for(let k=0;k<=idx;k++) aucD+=' L '+this.ORAL[k].x.toFixed(1)+' '+this.ORAL[k].y.toFixed(1);
    aucD+=' L '+penO.x.toFixed(1)+' '+penO.y.toFixed(1)+' L '+penO.x.toFixed(1)+' '+this.gyB+' Z';
    // onset / duration reveal + above-MEC therapeutic shade
    const revF=gfrac*(N-1);
    const onShown=revF>=this.onsetF;
    const durShown=revF>=this.offsetF;
    let mecShade='';
    if(onShown){
      const i0=Math.ceil(this.onsetF);
      const i1= durShown? Math.floor(this.offsetF) : idx;
      mecShade='M '+this.onsetX.toFixed(1)+' '+this.mecY.toFixed(1);
      for(let k=i0;k<=i1;k++) mecShade+=' L '+this.ORAL[k].x.toFixed(1)+' '+this.ORAL[k].y.toFixed(1);
      const ex= durShown? this.offsetX : penO.x;
      const ey= durShown? this.mecY : penO.y;
      mecShade+=' L '+ex.toFixed(1)+' '+ey.toFixed(1)+' L '+ex.toFixed(1)+' '+this.mecY.toFixed(1)+' Z';
    }

    // phase caption — correct ADME order with first-pass inside Absorption
    let phaseLabel;
    if(t<3.4) phaseLabel='① กลืนเม็ดยา → กระเพาะ — ยาแตกตัว (disintegration)';
    else if(t<9.7) phaseLabel='② A — Absorption: ลำไส้ดูดซึม + ผ่านตับ first-pass สกัด ~60% ก่อนเข้าระบบ';
    else if(t<12.8) phaseLabel='③ D — Distribution: ยา ~30% กระจายไปจับตัวรับเป้าหมาย';
    else if(t<15.6) phaseLabel='④ M — Metabolism: ยากระจายตัวไปที่ตับ แล้วถูกเปลี่ยนรูปเป็นเมแทบอไลต์';
    else if(t<18.4) phaseLabel='⑤ E — Excretion: ไตขับยา/เมแทบอไลต์ออกทางปัสสาวะ';
    else phaseLabel='✓ ครบวงจร ADME — Bioavailability (F) ≈ 30% ของขนาดที่กิน';

    // budget bar
    const PX=5.0;
    const wSys=nSystemic*PX, wFp=nLoss*PX, wNa=nNotAbs*PX;
    const fpX=636+wSys, naX=636+wSys+wFp;

    return {
      progW:+((t/L)*1168).toFixed(1),
      phaseLabel,
      playLabel: this.state.playing?'⏸ หยุด':'▶ เล่น',
      togglePlay: ()=>this.setState(s=>({playing:!s.playing})),
      replay: ()=>{ this.elapsed=0; this.last=performance.now(); this.setState({t:0,playing:true}); },

      capTransform, capOp:+capOp.toFixed(2),
      particles,

      // organ active highlights (liver lights for first-pass during A, and again for M)
      gStom:+(0.30*win(1.8,3.4)).toFixed(2),
      gInt:+(0.26*win(3.4,7.6)).toFixed(2),
      gLiv:+(0.30*((t>=7.6&&t<9.7)||(t>=13.5&&t<15.6)?1:0)).toFixed(2),
      gHeart:+(0.26*win(9.7,12.8)).toFixed(2),
      gKid:+(0.26*win(15.6,18.4)).toFixed(2),

      // ADME badges — correct order A -> D -> M -> E
      aBadge:+(t>=3.4&&t<9.7?1:0.34).toFixed(2),
      dBadge:+(t>=9.7&&t<12.8?1:0.34).toFixed(2),
      mBadge:+(t>=12.8&&t<15.6?1:0.34).toFixed(2),
      eBadge:+(t>=15.6&&t<18.4?1:0.34).toFixed(2),
      returnOp:+(t>=12.6&&t<15.6?1:0).toFixed(2),
      targetGlow:+(0.5+0.5*Math.sin(t*6)).toFixed(2),

      // budget
      fPctStr,
      sysLabel:'เข้าเลือด '+nSystemic, fpLabel:'first-pass '+nLoss, naLabel:'ไม่ดูดซึม '+nNotAbs,
      wSys:+wSys.toFixed(1), wFp:+wFp.toFixed(1), wNa:+wNa.toFixed(1),
      fpX:+fpX.toFixed(1), naX:+naX.toFixed(1),
      sysLabelX:+(636+wSys/2).toFixed(1),
      fpLabelX:+(fpX+wFp/2).toFixed(1),
      naLabelX:+(naX+wNa/2).toFixed(1),
      sysOp:+cl((t-9.2)/0.5).toFixed(2),
      fpOp:+cl((t-7.6)/0.5).toFixed(2),
      naOp:+cl((t-5.5)/0.5).toFixed(2),

      // graph
      curveOp: gfrac>0.005?1:0,
      penOp: gfrac>0.01&&gfrac<0.999?1:0,
      oralD,aucD,mecShade,
      penOX:+penO.x.toFixed(1), penOY:+penO.y.toFixed(1),
      mecY:+this.mecY.toFixed(1),
      mecLabelY:+(this.mecY-6).toFixed(1),
      onsetX:+this.onsetX.toFixed(1),
      offsetX:+this.offsetX.toFixed(1),
      durMidX:+(((this.onsetX+this.offsetX)/2)).toFixed(1),
      durArrowY:+(this.mecY+18).toFixed(1),
      durLabelY:+(this.mecY+35).toFixed(1),
      onsetLabelY:456,
      onsetOp: onShown?1:0,
      durOp: durShown?1:0
    };
  }
}
</script>
